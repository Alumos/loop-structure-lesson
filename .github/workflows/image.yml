name: Verify and build classroom image
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image-name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: moon-classroom:smoke
          cache-from: type=gha
      - name: Verify container health, authentication and persistence
        shell: bash
        run: |
          set -euo pipefail
          docker volume create classroom-smoke-data
          docker run -d --name classroom-smoke -p 127.0.0.1:19343:3000 \
            -e AUTH_MODE=demo -e DEMO_PASSWORD=ci-smoke-password \
            -v classroom-smoke-data:/app/data moon-classroom:smoke
          trap 'docker logs classroom-smoke; docker rm -f classroom-smoke; docker volume rm classroom-smoke-data' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:19343/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:19343/teacher > /dev/null
          curl -fsS -c /tmp/classroom-cookie -H 'Content-Type: application/json' \
            -d '{"username":"Alumos","password":"ci-smoke-password"}' \
            http://127.0.0.1:19343/api/teacher/login
          curl -fsS -b /tmp/classroom-cookie -H 'Content-Type: application/json' \
            -d '{"classId":"demo-5","name":"Container smoke test"}' \
            http://127.0.0.1:19343/api/teacher/classrooms
          docker restart classroom-smoke
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:19343/api/health; then break; fi
            sleep 2
          done
          curl -fsS -b /tmp/classroom-cookie http://127.0.0.1:19343/api/teacher/classrooms \
            | python3 -c 'import json,sys; assert any(c["name"]=="Container smoke test" for c in json.load(sys.stdin))'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image-name.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
